[package]
description = "Behavior, interaction, and infrastructure foundations for GPUI applications."
keywords = ["desktop", "gpui", "ui", "foundation"]
license = "Apache-2.0"
name = "gpui-base"
# The examples are development tools that read fixtures from `crates/story`;
# they stay out of the published package.
exclude = ["examples/"]
repository = "https://github.com/longbridge/gpui-kit"
homepage = "https://gpui-kit.com"
documentation = "https://docs.rs/gpui-base"
version = "0.6.1"
publish = true
edition = "2024"

[lib]
doctest = false

[[bench]]
name = "motion"
harness = false

[features]
test-support = ["gpui/test-support"]
inspector = ["gpui_macros/inspector", "gpui/inspector"]

[dependencies]
anyhow = "1"
aho-corasick = "1.1.3"
chrono = "0.4.38"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b", default-features = false }
gpui_macros = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b" }
instant = { version = "0.1", features = ["wasm-bindgen"] }
lsp-types = { version = "0.97.0", features = ["proposed"] }
markdown = { version = "1.0.0", features = ["serde"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3.0"
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
regex = "1"
schemars = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
smallvec = "1"
sum-tree = { package = "sum_tree", git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b" }
tracing = "0.1.41"
unicode-segmentation = "1.12.0"
web-time = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b", default-features = false, features = ["test-support"] }
indoc = "2"
reqwest_client = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b" }
