name: Foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Skip dependency caches for a clean environment
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GPUIO_JOBS: 3
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux system prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang lld llvm pkg-config curl git \
            libfontconfig-dev libfreetype-dev libssl-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev mesa-vulkan-drivers libasound2-dev libglib2.0-dev \
            xvfb xauth openbox x11-utils x11-xserver-utils weston dbus-x11
      - name: macOS system prerequisites
        if: runner.os == 'macOS'
        run: |
          for package in pkg-config gpatch; do
            brew list "$package" >/dev/null || brew install "$package"
          done
          echo "$(brew --prefix gpatch)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install pinned opam
        run: python3 scripts/ci_opam.py
      - name: Restore dependency caches
        id: dependency-cache
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .opam-root
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: foundation-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpuio.opam.locked', 'third_party/sources.json', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            foundation-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap isolated environment
        run: |
          mkdir -p .cache/ci
          ./scripts/gpuio bootstrap 2>&1 | tee .cache/ci/bootstrap.log
          ./scripts/gpuio doctor
      - name: Formatting
        run: ./scripts/gpuio check-fmt
      - name: Build
        run: ./scripts/gpuio build 2>&1 | tee .cache/ci/build.log
      - name: Preserve successful dependency build
        if: ${{ !inputs.clean_build && steps.dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .opam-root
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: foundation-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpuio.opam.locked', 'third_party/sources.json', 'rust-toolchain.toml', 'Cargo.lock') }}
      - name: OCaml and Rust tests
        run: ./scripts/gpuio test 2>&1 | tee .cache/ci/tests.log
      - name: Verify native runtime has no Async symbols
        run: python3 -c 'import subprocess; symbols = subprocess.check_output(["nm", "_build/default/examples/runtime/main.exe"], text=True); assert "camlAsync" not in symbols; print("NO_ASYNC_PASS")' 2>&1 | tee .cache/ci/no-async.log
      - name: Lint
        id: lint
        run: ./scripts/gpuio lint 2>&1 | tee .cache/ci/lint.log
      - name: Build and lint native UI tests
        run: |
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-tests --test native_ui --no-run
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-tests --test native_editor --no-run
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-tests --test native_controls --no-run
          ./scripts/gpuio exec cargo clippy --locked -p gpuio-native --features native-tests --all-targets -- -D warnings
      - name: macOS public runtime checks
        if: runner.os == 'macOS'
        run: |
          python3 -c 'import subprocess; [subprocess.run(["_build/default/examples/runtime/main.exe", flag], check=True, timeout=90) for flag in ["--self-test", "--shutdown-test", "--last-window-test"]]' 2>&1 | tee .cache/ci/macos-runtime.log
          python3 -c 'import subprocess; [subprocess.run(["_build/default/examples/runtime/bench.exe", str(windows)] + mode, check=True, timeout=90) for windows in [1, 4] for mode in [[], ["--clock"]]]' 2>&1 | tee .cache/ci/macos-runtime-measurements.log
          _build/default/examples/runtime/bench_input.exe 2>&1 | tee .cache/ci/macos-runtime-input-core.log
      - name: macOS typed UI checks
        if: runner.os == 'macOS'
        run: |
          python3 -c 'import subprocess; subprocess.run(["./scripts/gpuio", "exec", "cargo", "test", "--locked", "-p", "gpuio-native", "--features", "native-tests", "--test", "native_ui"], check=True, timeout=90)' 2>&1 | tee .cache/ci/macos-typed-native.log
          python3 -c 'import subprocess; subprocess.run(["_build/default/examples/view_api/main.exe", "--self-test"], check=True, timeout=90)' 2>&1 | tee .cache/ci/macos-typed-bridge.log
      - name: macOS native control checks
        if: runner.os == 'macOS'
        run: |
          python3 -c 'import subprocess; subprocess.run(["./scripts/gpuio", "exec", "cargo", "test", "--locked", "-p", "gpuio-native", "--features", "native-tests", "--test", "native_controls"], check=True, timeout=90)' 2>&1 | tee .cache/ci/macos-controls-native.log
      - name: macOS native editor checks
        if: runner.os == 'macOS'
        run: |
          python3 -c 'import subprocess; subprocess.run(["./scripts/gpuio", "exec", "cargo", "test", "--locked", "-p", "gpuio-native", "--features", "native-tests", "--test", "native_editor"], check=True, timeout=90)' 2>&1 | tee .cache/ci/macos-editor-native.log
          python3 -c 'import subprocess; subprocess.run(["_build/default/examples/text_input/main.exe", "--self-test"], check=True, timeout=90)' 2>&1 | tee .cache/ci/macos-editor-public.log
      - name: macOS native smoke
        if: runner.os == 'macOS'
        run: |
          python3 -c 'import subprocess; subprocess.run(["./scripts/gpuio", "smoke", "--self-test"], check=True, timeout=90)' 2>&1 | tee .cache/ci/macos-native.log
          python3 -c 'import subprocess; subprocess.run(["./scripts/gpuio", "smoke", "--two-windows"], check=True, timeout=90)' 2>&1 | tee .cache/ci/macos-two-windows.log
      - name: macOS production bridge smoke
        if: runner.os == 'macOS'
        run: python3 -c 'import subprocess; subprocess.run(["_build/default/examples/bridge/main.exe"], check=True, timeout=90)' 2>&1 | tee .cache/ci/macos-bridge.log
      - name: Linux X11 native smoke
        id: x11-smoke
        continue-on-error: true
        if: runner.os == 'Linux'
        run: ./scripts/ci_linux_smoke.sh x11 2>&1 | tee .cache/ci/x11.log
      - name: Linux Wayland native smoke
        id: wayland-smoke
        continue-on-error: true
        if: runner.os == 'Linux' && !cancelled() && steps.lint.outcome == 'success'
        run: ./scripts/ci_linux_smoke.sh wayland 2>&1 | tee .cache/ci/wayland.log
      - name: Report informational Linux GUI results
        if: runner.os == 'Linux' && always()
        env:
          GPUIO_X11_OUTCOME: ${{ steps.x11-smoke.outcome }}
          GPUIO_WAYLAND_OUTCOME: ${{ steps.wayland-smoke.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = {"required": False, "deferred_acceptance": "OCH-17",
                    "x11": os.environ["GPUIO_X11_OUTCOME"],
                    "wayland": os.environ["GPUIO_WAYLAND_OUTCOME"]}
          Path(".cache/ci").mkdir(parents=True, exist_ok=True)
          Path(".cache/ci/linux-gui-status.json").write_text(json.dumps(result, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Linux GUI checks are informational; full acceptance is tracked in OCH-17.\n\n")
              summary.write(f"X11: {result['x11']}; Wayland: {result['wayland']}\n")
          PY
      - name: Record environment
        if: always()
        run: |
          mkdir -p .cache/ci
          uname -a > .cache/ci/platform.txt
          opam list --root .opam-root --switch gpuio --installed --columns=name,version --short > .cache/ci/packages.txt || true
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-logs-${{ runner.os }}-${{ runner.arch }}
          include-hidden-files: true
          path: .cache/ci
      - name: Development executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-example-${{ runner.os }}-${{ runner.arch }}
          path: _build/default/examples/foundation/main.exe
