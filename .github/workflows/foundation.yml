name: Foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Skip dependency caches for a clean environment
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # The macOS required suite includes a measured ~18-minute full-history test
    # after dependency/consumer builds. Run 36791905054 was cancelled near the
    # 90-minute ceiling during the final workload; per-test watchdogs remain.
    timeout-minutes: ${{ matrix.os == 'macos-15' && 120 || 90 }}
    env:
      GPUIO_JOBS: 3
      CARGO_TERM_COLOR: never
      # A CI job does not edit sources between builds; incremental variants consume
      # scarce hosted-runner disk across the native feature matrix.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Example documentation inventory
        run: python3 scripts/audit_example_docs.py
      - name: Linux system prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang lld llvm pkg-config curl git \
            libfontconfig-dev libfreetype-dev libssl-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev mesa-vulkan-drivers libasound2-dev libglib2.0-dev \
            xvfb xauth openbox x11-utils x11-xserver-utils weston dbus-x11 xdg-utils desktop-file-utils
      - name: macOS system prerequisites
        if: runner.os == 'macOS'
        run: |
          for package in pkg-config gpatch; do
            brew list "$package" >/dev/null || brew install "$package"
          done
          echo "$(brew --prefix gpatch)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: macOS GUI desktop space
        if: runner.os == 'macOS'
        run: |
          mkdir -p .cache/ci
          xcrun swift -module-cache-path .cache/macos-display-modules scripts/ci_macos_display.swift --apply 2>&1 | tee .cache/ci/macos-display-setup.log
          xcrun swift -module-cache-path .cache/macos-display-modules scripts/ci_macos_display.swift --check 2>&1 | tee .cache/ci/macos-display-check.log
      - name: macOS notification service
        if: runner.os == 'macOS'
        run: python3 scripts/ci_macos_notifications.py 2>&1 | tee .cache/ci/macos-notification-setup.log
      - name: Install pinned opam
        run: python3 scripts/ci_opam.py
      - name: Restore dependency caches
        id: dependency-cache
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .opam-root
            ~/.cargo/registry
            ~/.cargo/git
          key: foundation-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpuio.opam.locked', 'third_party/sources.json', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            foundation-v2-${{ runner.os }}-${{ runner.arch }}-
            foundation-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare bounded CI build storage
        run: |
          mkdir -p .cache/ci
          python3 scripts/test_ci_storage.py
          # A legacy v1 fallback may contain target/. Keep package/switch caches,
          # but start this job's native feature builds without stale outputs.
          python3 scripts/ci_storage.py --discard-restored-target 2>&1 | tee .cache/ci/storage-start.log
      - name: Bootstrap isolated environment
        run: |
          mkdir -p .cache/ci
          ./scripts/gpuio bootstrap 2>&1 | tee .cache/ci/bootstrap.log
          ./scripts/gpuio doctor
      - name: Formatting
        run: ./scripts/gpuio check-fmt
      - name: Offline Bonsai reconstruction admission
        run: python3 scripts/test_vendor_bonsai.py 2>&1 | tee .cache/ci/bonsai-vendor-inputs.log
      - name: Pinned accessibility consumer reconstruction
        run: |
          curl --fail --location --retry 3 --output .cache/ci/accesskit_consumer-0.38.0.crate https://crates.io/api/v1/crates/accesskit_consumer/0.38.0/download
          python3 scripts/verify_accesskit_consumer.py --archive .cache/ci/accesskit_consumer-0.38.0.crate 2>&1 | tee .cache/ci/accessibility-consumer-source.log
      - name: Build
        id: build
        run: ./scripts/gpuio build 2>&1 | tee .cache/ci/build.log
      - name: Preserve successful dependency build
        if: ${{ !inputs.clean_build && steps.dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .opam-root
            ~/.cargo/registry
            ~/.cargo/git
          key: foundation-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpuio.opam.locked', 'third_party/sources.json', 'rust-toolchain.toml', 'Cargo.lock') }}
      - name: OCaml and Rust tests
        id: unit_tests
        run: ./scripts/gpuio test 2>&1 | tee .cache/ci/tests.log
      - name: macOS AppKit scroll phase conversion (no window)
        if: runner.os == 'macOS'
        run: python3 scripts/test_macos_scroll_phases.py --output .cache/ci/scroll-phases
      - name: Diagnose Linux native test stack failure
        if: runner.os == 'Linux' && failure() && steps.unit_tests.outcome == 'failure'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          # Diagnostic only: the original test step remains a required failure.
          # Compare the failing fixture at the default stack and at 8 MiB; do
          # not silently increase the stack for the required suite.
          sudo apt-get install -y gdb
          ./scripts/gpuio exec cargo test -p gpuio-native --lib --locked \
            --features native-image-tests,native-canvas-tests --no-run \
            --message-format=json -j "$GPUIO_JOBS" > .cache/ci/native-stack-build.jsonl
          python3 - <<'PY'
          import json, os, signal, subprocess
          from pathlib import Path
          messages = [json.loads(line) for line in Path('.cache/ci/native-stack-build.jsonl').read_text().splitlines()]
          binaries = {m['executable'] for m in messages
                      if m.get('reason') == 'compiler-artifact' and m.get('executable')
                      and m['target']['name'] == 'gpuio_native' and m['profile']['test']}
          assert len(binaries) == 1, binaries
          binary = binaries.pop()
          case = 'host::sidebar_labels_view_test::public_sidebar_labels_retain_focus_paint_once_and_route_one_activation'
          arguments = [binary, '--exact', case, '--nocapture', '--test-threads=1']
          probes = [
              ('default-backtrace', ['gdb', '--batch', '-ex', 'set pagination off',
                                    '-ex', 'set disable-randomization off', '-ex', 'run',
                                    '-ex', 'thread apply all bt 60', '--args', *arguments], {}),
              ('eight-mib', arguments, {'RUST_MIN_STACK': '8388608'}),
          ]
          for name, command, overrides in probes:
              with Path(f'.cache/ci/native-stack-{name}.log').open('w') as log:
                  process = subprocess.Popen(command, env={**os.environ, **overrides},
                                             stdout=log, stderr=subprocess.STDOUT,
                                             start_new_session=True)
                  try:
                      print(name, 'exit', process.wait(timeout=90), flush=True)
                  except subprocess.TimeoutExpired:
                      # Include the debugger's inferior, not just the debugger.
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      process.wait()
                      print(name, 'timed out', flush=True)
          PY
      - name: Inherited output and Eio cancellation (no display)
        run: |
          ./scripts/gpuio build test/output/probe.exe
          python3 scripts/test_output_sink.py 2>&1 | tee .cache/ci/output-sink.log
      - name: Chart measurement diagnostics (no display)
        run: python3 scripts/test_measure_chart_stream.py 2>&1 | tee .cache/ci/chart-measurement-diagnostics.log
      - name: Accessibility traversal diagnostics (no display)
        run: python3 scripts/test_mac_ax_helpers.py 2>&1 | tee .cache/ci/ax-traversal.log
      - name: Window pointer readiness (no display)
        run: python3 scripts/test_mac_window_readiness.py 2>&1 | tee .cache/ci/window-pointer-readiness.log
      - name: Results column geometry readiness (no display)
        run: python3 scripts/test_results_geometry.py 2>&1 | tee .cache/ci/results-geometry-readiness.log
      - name: Input-source restoration scope (no display)
        run: python3 scripts/test_mac_input_source.py 2>&1 | tee .cache/ci/input-source-scope.log
      - name: Clipboard preservation scope (no display)
        run: python3 scripts/test_mac_clipboard.py 2>&1 | tee .cache/ci/clipboard-preservation.log
      - name: System appearance restoration scope (no display)
        run: python3 scripts/test_mac_system_appearance.py 2>&1 | tee .cache/ci/appearance-restoration.log
      - name: Appearance palette backing-scale validation (no display)
        run: python3 scripts/test_appearance_palette.py 2>&1 | tee .cache/ci/appearance-palette.log
      - name: Loaded-history measurement diagnostics (no display)
        run: python3 scripts/test_measure_list_history.py 2>&1 | tee .cache/ci/list-measurement-diagnostics.log
      - name: Presentation report pairing and failure sensitivity (no display)
        run: python3 scripts/test_presentation_report.py 2>&1 | tee .cache/ci/presentation-report-diagnostics.log
      - name: Table performance report validation
        run: python3 scripts/test_measure_table_history.py 2>&1 | tee .cache/ci/table-measurement-diagnostics.log
      - name: Resource lifecycle report validation (no display)
        run: python3 scripts/test_measure_resource_lifecycle.py 2>&1 | tee .cache/ci/lifecycle-measurement-diagnostics.log
      - name: Native entity audit sensitivity (no display)
        run: |
          ./scripts/gpuio exec cargo test --manifest-path examples/resource_audit/rust/Cargo.toml --locked --lib 2>&1 | tee .cache/ci/native-entity-audit.log
          ./scripts/gpuio exec cargo test --manifest-path examples/resource_audit/rust/Cargo.toml --locked --features presentation-diagnostics --lib 2>&1 | tee .cache/ci/presentation-retirement-sensitivity.log
      - name: macOS physical-memory report validation (no display)
        run: python3 scripts/test_mac_process_memory.py 2>&1 | tee .cache/ci/physical-memory-report-diagnostics.log
      - name: macOS Metal counter calibration (no visible window)
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc scripts/qualify_metal_counter.swift -o .cache/ci/qualify-metal-counter
          .cache/ci/qualify-metal-counter | tee .cache/ci/metal-counter-calibration.json
      - name: GPUI standalone manifest validation (no display)
        run: python3 scripts/test_vendor_gpui.py 2>&1 | tee .cache/ci/gpui-manifest-diagnostics.log
      - name: Document growth report validation (no display)
        run: python3 scripts/test_measure_document_growth.py 2>&1 | tee .cache/ci/document-measurement-diagnostics.log
      - name: Concurrent streaming and typing report validation (no display)
        run: python3 scripts/test_measure_streaming_typing.py 2>&1 | tee .cache/ci/streaming-typing-diagnostics.log
      - name: Focused and unfocused idle report validation (no display)
        run: python3 scripts/test_measure_idle.py 2>&1 | tee .cache/ci/idle-report-diagnostics.log
      - name: Reference packaging input validation (no display)
        run: python3 scripts/test_package_macos_reference.py 2>&1 | tee .cache/ci/reference-package-inputs.log
      - name: Extracted package runtime admission (no display)
        run: python3 scripts/test_package_runtime_inputs.py 2>&1 | tee .cache/ci/package-runtime-inputs.log
      - name: Package transfer provenance validation (no display)
        run: python3 scripts/test_package_transfer.py 2>&1 | tee .cache/ci/package-transfer-inputs.log
      - name: Static backend composition tests (no display)
        run: python3 scripts/test_compose_backend.py 2>&1 | tee .cache/ci/backend-composition.log
      - name: Dependency notice collection tests (no display)
        run: python3 scripts/test_collect_rust_notices.py 2>&1 | tee .cache/ci/dependency-notices.log
      - name: OCaml dependency notice collection (no display)
        run: python3 scripts/test_collect_ocaml_notices.py 2>&1 | tee .cache/ci/ocaml-dependency-notices.log
      - name: Linux desktop instance arbitration (private bus, no display)
        if: runner.os == 'Linux'
        run: scripts/test_desktop_instance_bus.sh 2>&1 | tee .cache/ci/desktop-instance.log
      - name: Linux desktop entry executable dispatch (no display)
        if: runner.os == 'Linux'
        run: python3 scripts/test_desktop_entry_linux.py 2>&1 | tee .cache/ci/desktop-entry-exec.log
      - name: Linux notification transport (private bus, no display)
        if: runner.os == 'Linux'
        run: scripts/test_notification_bus.sh 2>&1 | tee .cache/ci/notification-bus.log
      - name: Verify native runtime has no Async symbols
        run: python3 -c 'import subprocess; symbols = subprocess.check_output(["nm", "_build/default/examples/runtime/main.exe"], text=True); assert "camlAsync" not in symbols; print("NO_ASYNC_PASS")' 2>&1 | tee .cache/ci/no-async.log
      - name: Lint
        id: lint
        run: ./scripts/gpuio lint 2>&1 | tee .cache/ci/lint.log
      - name: Performance collector checks (no display)
        run: |
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features presentation-diagnostics,native-image-tests,native-canvas-tests --lib performance::tests 2>&1 | tee .cache/ci/performance-collector.log
          ./scripts/gpuio exec cargo clippy --locked -p gpuio-native --features presentation-diagnostics,native-image-tests,native-canvas-tests --lib --tests -- -D warnings
      - name: Presentation workload builds and probe contracts (no display)
        run: |
          ./scripts/gpuio build examples/performance_presented/list/main.exe examples/performance_presented/table/main.exe examples/performance_presented/document/main.exe examples/performance_presented/streaming/main.exe
          ./scripts/gpuio exec cargo test --manifest-path examples/performance_presented/backend/Cargo.toml --locked -p gpuio-performance-probe --lib 2>&1 | tee .cache/ci/presentation-probe.log
          ./scripts/gpuio exec cargo clippy --manifest-path examples/performance_presented/backend/Cargo.toml --locked -p gpuio-performance-probe --lib --tests -- -D warnings
      - name: Build and lint native UI tests
        id: native-ui-build
        run: |
          ./scripts/gpuio exec cargo test --locked -p gpuio-table-adapter --features native-tests --test native_table --no-run
          ./scripts/gpuio exec cargo clippy --locked -p gpuio-table-adapter --features native-tests --all-targets -- -D warnings
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-tests --test native_ui --no-run
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-tests --test native_editor --no-run
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-tests --test native_controls --test native_command_binding --test native_menu_popup_queue --test native_table_host --test native_table_history --no-run
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-tests --test native_scroll --test native_list --test native_highlight_host --test native_document --test native_window --test native_tabs --test native_navigation --test native_tree --test native_carousel --test native_hover_card --test native_split --test native_extension --no-run
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-tests --test native_animation --test native_animation_program --test native_presentation --test native_slider --test native_number_input --test native_otp_input --test native_calendar --test native_color_input --test native_drag_drop --test native_file_dialog --no-run
          ./scripts/gpuio exec cargo clippy --locked -p gpuio-native --features native-tests --all-targets -- -D warnings
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-image-tests --test native_images --test native_text_shimmer_paint --test native_text_shimmer_clock --test native_text_shimmer_view --test native_styled_text --test native_border_style --test native_aspect_ratio --test native_grid_location --test native_opacity_factor --test native_link --test native_highlight_paint --test native_highlight_view --test native_highlight_document --test native_image_views --test native_container_query --test native_presentation --test native_slider --test native_number_input --test native_otp_input --test native_calendar --test native_color_input --no-run
          ./scripts/gpuio exec cargo clippy --locked -p gpuio-native --features native-image-tests --all-targets -- -D warnings
          ./scripts/gpuio exec cargo test --locked -p gpuio-native --features native-canvas-tests --test native_canvas --test native_canvas_view --test native_canvas_input --test native_chart_paint --test native_chart_labels --test native_chart_view --test native_chart_input --test native_chart_inspection --no-run
          ./scripts/gpuio exec cargo clippy --locked -p gpuio-native --features native-canvas-tests --all-targets -- -D warnings
      - name: Record storage before independent consumers
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_storage.py 2>&1 | tee .cache/ci/storage-consumers.log
      - name: Independent default-backend starter consumer
        id: starter-consumer
        run: python3 scripts/test_extension_consumer.py --cleanup --example getting_started 2>&1 | tee .cache/ci/starter-consumer.log
      - name: Independent native extension consumer
        id: extension-consumer
        run: python3 scripts/test_extension_consumer.py --cleanup 2>&1 | tee .cache/ci/extension-consumer.log
      - name: Independent public gallery consumer
        id: gallery-consumer
        run: python3 scripts/test_extension_consumer.py --cleanup --example gallery 2>&1 | tee .cache/ci/gallery-consumer.log
      - name: macOS Settings keyboard composition
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section settings-composition --images .cache/ci/settings-composition 2>&1 | tee .cache/ci/macos-settings-composition.log
      - name: macOS Settings field retention
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section settings-fields --images .cache/ci/settings-fields 2>&1 | tee .cache/ci/macos-settings-fields.log
      - name: macOS gallery forms and editor admission
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: |
          python3 scripts/test_gallery.py --section forms --images .cache/ci/forms 2>&1 | tee .cache/ci/macos-forms.log
          python3 scripts/test_gallery.py --section editor-groups 2>&1 | tee .cache/ci/macos-editor-groups.log
      - name: macOS public editor and accessibility range geometry
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery_editor_geometry.py --report .cache/ci/editor-range-geometry.json 2>&1 | tee .cache/ci/macos-editor-range-geometry.log
      - name: macOS screen-point accessibility routing
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_macos_hit_testing.py --output .cache/ci/ax-point-routing 2>&1 | tee .cache/ci/macos-ax-point-routing.log
      - name: macOS public choice picker keyboard search
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section choice-pickers --images .cache/ci/choice-pickers 2>&1 | tee .cache/ci/macos-choice-pickers.log
      - name: macOS native scrollbar preference application
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 5
        run: python3 scripts/test_macos_scrollbar_preference.py --output .cache/ci/scrollbar-preference 2>&1 | tee .cache/ci/macos-scrollbar-preference.log
      - name: macOS measured carousel keyboard and retained cards
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section carousel-track --images .cache/ci/carousel-track 2>&1 | tee .cache/ci/macos-carousel-track.log
      - name: macOS rich tabs and retained panels
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section tabs --images .cache/ci/tabs 2>&1 | tee .cache/ci/macos-tabs-gallery.log
      - name: macOS flat split-group input and retention
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section split-group --images .cache/ci/split-group 2>&1 | tee .cache/ci/macos-split-group-gallery.log
      - name: macOS measured carousel automatic pause and resume
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section carousel-automatic --images .cache/ci/carousel-automatic 2>&1 | tee .cache/ci/macos-carousel-automatic.log
      - name: macOS measured carousel pointer ownership and cancellation
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section carousel-drag --images .cache/ci/carousel-drag 2>&1 | tee .cache/ci/macos-carousel-drag.log
      - name: macOS measured carousel line-wheel routing and edges
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section carousel-wheel --images .cache/ci/carousel-wheel 2>&1 | tee .cache/ci/macos-carousel-wheel.log
      - name: macOS sidebar policies and retained appearance
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section sidebar --images .cache/ci/sidebar 2>&1 | tee .cache/ci/macos-sidebar.log
      - name: macOS notification placement and keyboard lifecycle
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 4
        run: python3 scripts/test_gallery.py --section notifications --images .cache/ci/notifications 2>&1 | tee .cache/ci/macos-notifications.log
      - name: macOS notification hover and active-time expiry
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section notification-policy --images .cache/ci/notification-policy 2>&1 | tee .cache/ci/macos-notification-policy.log
      - name: macOS notification entrance and reduced-motion geometry
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 2
        run: python3 scripts/test_gallery.py --section notification-motion --images .cache/ci/notification-motion 2>&1 | tee .cache/ci/macos-notification-motion.log
      - name: macOS public clipboard writes and feedback
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_gallery.py --section clipboard 2>&1 | tee .cache/ci/macos-clipboard.log
      - name: macOS selected document shutdown with Rust backtraces
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: python3 scripts/test_macos_document_shutdown.py --log .cache/ci/document-shutdown-app.log --report .cache/ci/document-shutdown.json 2>&1 | tee .cache/ci/macos-document-shutdown.log
      - name: macOS native context popup interaction and lifecycle
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 5
        run: |
          ./scripts/gpuio build examples/menus/main.exe
          python3 scripts/test_native_popup_macos.py 2>&1 | tee .cache/ci/macos-native-popup.log
          for mode in close retire invalidate replace hide disable modal; do
            python3 scripts/test_native_popup_macos.py --lifecycle "$mode" 2>&1 | tee ".cache/ci/macos-native-popup-$mode.log"
          done
          ./scripts/gpuio build examples/menu_controller/main.exe
          python3 scripts/test_menu_controller_macos.py 2>&1 | tee .cache/ci/macos-menu-controller.log
          python3 scripts/test_native_menu_icons_macos.py --output .cache/ci/native-menu-icons 2>&1 | tee .cache/ci/macos-native-menu-icons.log
      - name: macOS native popup window and editor ownership
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: |
          ./scripts/gpuio build examples/menu_controller/main.exe
          python3 scripts/test_menu_multiwindow_macos.py 2>&1 | tee .cache/ci/macos-menu-multiwindow.log
      - name: macOS native popup queued-start cancellation
        if: runner.os == 'macOS' && !cancelled() && steps.native-ui-build.outcome == 'success'
        timeout-minutes: 3
        run: |
