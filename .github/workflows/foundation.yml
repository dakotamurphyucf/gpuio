name: Foundation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrollbar-initialization-diagnostic:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compare AppKit initialization phases
        run: |
          mkdir -p .cache/scrollbar-diagnostic
          sw_vers > .cache/scrollbar-diagnostic/platform.txt
          xcrun swiftc scripts/macos_scrollbar_initialization.swift -o .cache/scrollbar-diagnostic/oracle
          .cache/scrollbar-diagnostic/oracle > .cache/scrollbar-diagnostic/current.jsonl
          .cache/scrollbar-diagnostic/oracle -AppleShowScrollBars Always > .cache/scrollbar-diagnostic/always.jsonl
          .cache/scrollbar-diagnostic/oracle -AppleShowScrollBars WhenScrolling > .cache/scrollbar-diagnostic/overlay.jsonl
          .cache/scrollbar-diagnostic/oracle -AppleShowScrollBars Automatic > .cache/scrollbar-diagnostic/automatic.jsonl
          cat .cache/scrollbar-diagnostic/*.jsonl
      - name: Validate corrected initialized oracle
        run: |
          xcrun swiftc scripts/macos_scrollbar_preference.swift -o .cache/scrollbar-diagnostic/settled-oracle
          .cache/scrollbar-diagnostic/settled-oracle > .cache/scrollbar-diagnostic/current-settled.json
          .cache/scrollbar-diagnostic/settled-oracle -AppleShowScrollBars Always > .cache/scrollbar-diagnostic/always-settled.json
          .cache/scrollbar-diagnostic/settled-oracle -AppleShowScrollBars WhenScrolling > .cache/scrollbar-diagnostic/overlay-settled.json
          .cache/scrollbar-diagnostic/settled-oracle -AppleShowScrollBars Automatic > .cache/scrollbar-diagnostic/automatic-settled.json
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          root = Path('.cache/scrollbar-diagnostic')
          for case in ['current', 'always', 'overlay', 'automatic']:
              sampled = [json.loads(line) for line in (root / (case + '.jsonl')).read_text().splitlines()]
              result = json.loads((root / (case + '-settled.json')).read_text())
              assert result['settled'] == sampled[-1]['style'], (case, sampled, result)
              if case in ['always', 'overlay']:
                  assert result['settled'] == ('Always_visible' if case == 'always' else 'Auto_hide')
              print(case, result)
          PYTEST
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scrollbar-initialization-diagnostic
          path: |
            .cache/scrollbar-diagnostic/*.jsonl
            .cache/scrollbar-diagnostic/*.json
            .cache/scrollbar-diagnostic/platform.txt
