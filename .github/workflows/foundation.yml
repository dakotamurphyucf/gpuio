name: Foundation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  notification-diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare desktop and retrieve previously built diagnostic binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/ci
          xcrun swift -module-cache-path .cache/macos-display-modules scripts/ci_macos_display.swift --apply
          gh run download 36377185296 --repo dakotamurphyucf/gpuio --name foundation-logs-macOS-ARM64 --dir .cache/previous
          chmod +x '.cache/previous/notification-os/GPUIO Notification Lab.app/Contents/MacOS/gpuio-notification'
      - name: Observe fresh notification authorization and accessibility
        run: python3 scripts/diagnose_notification_permission.py 2>&1 | tee .cache/ci/notification-diagnostic.log
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notification-permission-diagnostic
          include-hidden-files: true
          path: .cache/ci
