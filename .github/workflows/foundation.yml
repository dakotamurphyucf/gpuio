name: Foundation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Identify hosted display
        run: |
          mkdir -p .cache/metal-arm-pacing
          xcrun swift -module-cache-path .cache/modules scripts/ci_macos_display.swift --apply > .cache/metal-arm-pacing/display-setup.log
          xcrun swift -module-cache-path .cache/modules scripts/ci_macos_display.swift --check > .cache/metal-arm-pacing/display-check.log
          system_profiler SPDisplaysDataType -json > .cache/metal-arm-pacing/displays.json
          pmset -g custom > .cache/metal-arm-pacing/power.txt
          sw_vers > .cache/metal-arm-pacing/os.txt
          uname -m > .cache/metal-arm-pacing/architecture.txt
      - name: Collect two bounded diagnostics without qualifying release
        run: python3 scripts/diagnose_metal_arm_pacing.py
      - name: Preserve every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metal-arm-pacing
          include-hidden-files: true
          path: .cache/metal-arm-pacing
