# Diagnostic branch ONLY: never merge this replacement Foundation workflow.
name: Foundation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  receiver-replay:
    name: Exact packaged receiver replay with fatal stacks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Receive exact qualification archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-runtime-qualification-inputs
          github-token: ${{ github.token }}
          run-id: 37772649589
          path: .cache/macos-runtime-inputs
      - name: Verify transferred revision and hashes
        id: transfer
        run: |
          mkdir -p .cache/ci
          test ! -e .opam-root
          test ! -e _build
          test ! -e target
          python3 scripts/ci_macos_package_transfer.py verify \
            --directory .cache/macos-runtime-inputs --revision b13984c1960b3be8c1dde7241c12ac60b0555250 \
            2>&1 | tee .cache/ci/transfer-verification.log
      - name: Prepare the hosted desktop
        id: desktop
        run: |
          xcrun swift -module-cache-path .cache/macos-display-modules scripts/ci_macos_display.swift --apply 2>&1 | tee .cache/ci/display.log
          xcrun swift -module-cache-path .cache/macos-display-modules scripts/ci_macos_display.swift --check 2>&1 | tee -a .cache/ci/display.log
          python3 scripts/ci_macos_notifications.py 2>&1 | tee .cache/ci/notification-service.log
      - name: Extracted gallery runtime
        timeout-minutes: 5
        run: python3 scripts/test_macos_package_runtime.py --package .cache/macos-runtime-inputs/gallery --output .cache/ci/gallery 2>&1 | tee .cache/ci/gallery.log
      - name: Extracted Agent Workspace runtime
        if: ${{ !cancelled() && steps.transfer.outcome == 'success' && steps.desktop.outcome == 'success' }}
        timeout-minutes: 5
        run: python3 scripts/test_macos_package_runtime.py --package .cache/macos-runtime-inputs/agent_chat --output .cache/ci/agent-chat 2>&1 | tee .cache/ci/agent-chat.log
      - name: Extracted Signal Studio runtime
        if: ${{ !cancelled() && steps.transfer.outcome == 'success' && steps.desktop.outcome == 'success' }}
        timeout-minutes: 5
        run: python3 scripts/test_macos_package_runtime.py --package .cache/macos-runtime-inputs/signal_studio --output .cache/ci/signal-studio 2>&1 | tee .cache/ci/signal-studio.log
      - name: Preserve fresh-runner native crash reports
        if: always()
        run: |
          python3 - <<'PYCRASH'
          from pathlib import Path
          import shutil
          import time
          output = Path('.cache/ci/crashes')
          output.mkdir(parents=True, exist_ok=True)
          reports = Path.home() / 'Library/Logs/DiagnosticReports'
          cutoff = time.time() - 3600
          # This isolated hosted job is at most 20 minutes. Keep recent native
          # diagnostics alongside Python faulthandler output, bounded in size.
          candidates = [p for p in reports.glob('*.ips')
                        if p.is_file() and not p.is_symlink()
                        and p.stat().st_mtime >= cutoff and p.stat().st_size <= 5_000_000]
          for source in sorted(candidates, key=lambda p: p.stat().st_mtime, reverse=True)[:10]:
              shutil.copy2(source, output / source.name)
          print('CRASH_REPORTS_COLLECTED', len(list(output.iterdir())))
          PYCRASH
      - name: Preserve fresh-runner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receiver-trap-replay-evidence
          include-hidden-files: true
          path: .cache/ci
