          GPUIO_WAYLAND_OUTCOME: ${{ steps.wayland-smoke.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = {"required": False, "deferred_acceptance": "OCH-47",
                    "x11": os.environ["GPUIO_X11_OUTCOME"],
                    "wayland": os.environ["GPUIO_WAYLAND_OUTCOME"]}
          Path(".cache/ci").mkdir(parents=True, exist_ok=True)
          Path(".cache/ci/linux-gui-status.json").write_text(json.dumps(result, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Linux GUI checks are informational; full acceptance is tracked in OCH-47.\n\n")
              summary.write(f"X11: {result['x11']}; Wayland: {result['wayland']}\n")
          PY
      # Keep both independent presentation probes observable on failure, and do
      # not let a presentation failure suppress unrelated native/consumer checks.
      - name: macOS GPUI Metal presentation hook
        if: runner.os == 'macOS' && !cancelled()
        run: python3 scripts/test_metal_presentation.py --output .cache/ci/metal-presentation-hook
      - name: macOS Metal presentation API calibration
        if: runner.os == 'macOS' && !cancelled()
        timeout-minutes: 2
        run: |
          system_profiler SPDisplaysDataType -json > .cache/ci/metal-presentation-display.json
          xcrun swiftc -O scripts/qualify_metal_presentation.swift -o .cache/ci/metal-presentation-probe
          .cache/ci/metal-presentation-probe > .cache/ci/metal-presentation-calibration.json
      - name: Record environment
        if: always()
        run: |
          mkdir -p .cache/ci
          uname -a > .cache/ci/platform.txt
          opam list --root .opam-root --switch gpuio --installed --columns=name,version --short > .cache/ci/packages.txt || true
      - name: Assemble macOS runtime qualification inputs
        id: runtime-inputs
        # Independent qualification: a failed timing/behavior check must not
        # suppress fresh-machine evidence for successfully built executables.
        # The failed foundation check still blocks overall acceptance.
        if: runner.os == 'macOS' && !cancelled() && steps.build.outcome == 'success'
        timeout-minutes: 5
        run: |
          python3 scripts/ci_macos_package_transfer.py stage \
            --directory .cache/macos-runtime-inputs --revision "$GITHUB_SHA" \
            2>&1 | tee .cache/ci/macos-package-transfer.log
      - name: Transfer macOS qualification archives
        if: runner.os == 'macOS' && !cancelled() && steps.runtime-inputs.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-runtime-qualification-inputs
          path: .cache/macos-runtime-inputs
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-logs-${{ runner.os }}-${{ runner.arch }}
          include-hidden-files: true
          path: .cache/ci
      - name: Development executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-example-${{ runner.os }}-${{ runner.arch }}
          path: _build/default/examples/foundation/main.exe

  macos-package-runtime:
    name: macOS extracted apps (fresh runner)
    needs: foundation
    # Run independently of foundation's result. Missing/unverified archives
    # fail admission rather than looking like passing runtime qualification.
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 20
    # No dependency cache, opam bootstrap, Rust build or project installation.
    # The hosted image includes platform tools; this is not a blank macOS image.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Receive exact qualification archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-runtime-qualification-inputs
          path: .cache/macos-runtime-inputs
      - name: Verify transferred revision and hashes
        id: transfer
        run: |
          mkdir -p .cache/ci
          test ! -e .opam-root
          test ! -e _build
          test ! -e target
          python3 scripts/ci_macos_package_transfer.py verify \
            --directory .cache/macos-runtime-inputs --revision "$GITHUB_SHA" \
            2>&1 | tee .cache/ci/transfer-verification.log
      - name: Prepare the hosted desktop
        id: desktop
        run: |
          xcrun swift -module-cache-path .cache/macos-display-modules scripts/ci_macos_display.swift --apply 2>&1 | tee .cache/ci/display.log
          xcrun swift -module-cache-path .cache/macos-display-modules scripts/ci_macos_display.swift --check 2>&1 | tee -a .cache/ci/display.log
          python3 scripts/ci_macos_notifications.py 2>&1 | tee .cache/ci/notification-service.log
      - name: Extracted gallery runtime
        timeout-minutes: 5
        run: python3 scripts/test_macos_package_runtime.py --package .cache/macos-runtime-inputs/gallery --output .cache/ci/gallery 2>&1 | tee .cache/ci/gallery.log
      - name: Extracted Agent Workspace runtime
        if: ${{ !cancelled() && steps.transfer.outcome == 'success' && steps.desktop.outcome == 'success' }}
        timeout-minutes: 5
        run: python3 scripts/test_macos_package_runtime.py --package .cache/macos-runtime-inputs/agent_chat --output .cache/ci/agent-chat 2>&1 | tee .cache/ci/agent-chat.log
      - name: Extracted Signal Studio runtime
        if: ${{ !cancelled() && steps.transfer.outcome == 'success' && steps.desktop.outcome == 'success' }}
        timeout-minutes: 5
        run: python3 scripts/test_macos_package_runtime.py --package .cache/macos-runtime-inputs/signal_studio --output .cache/ci/signal-studio 2>&1 | tee .cache/ci/signal-studio.log
      - name: Preserve fresh-runner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package-runtime-evidence
          include-hidden-files: true
          path: .cache/ci
