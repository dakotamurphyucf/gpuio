[workspace]
members = ["rust/protocol", "rust/native", "rust/table", "rust/plot", "rust/foundation", "rust/portal", "rust/wayland", "rust/extension-sdk", "rust/document-sdk", "examples/extension_package/rust", "examples/document_profile_package/rust"]
resolver = "3"
exclude = ["vendor/gpui", "vendor/gpui-base", "vendor/accesskit-macos", "vendor/taffy"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dakotamurphyucf/gpuio"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

[patch.crates-io]
gpuio-document-sdk = { path = "rust/document-sdk" }
gpuio-extension-sdk = { path = "rust/extension-sdk" }
accesskit_macos = { path = "vendor/accesskit-macos" }
taffy = { path = "vendor/taffy" }

[patch."https://github.com/zed-industries/zed.git"]
gpui = { path = "vendor/gpui" }
