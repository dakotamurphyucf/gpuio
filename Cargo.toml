[workspace]
members = ["rust/protocol", "rust/native", "rust/table", "rust/foundation", "rust/portal", "rust/wayland", "rust/extension-sdk", "examples/extension_package/rust"]
resolver = "3"
exclude = ["vendor/gpui-base", "vendor/accesskit-macos", "vendor/taffy"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dakotamurphyucf/gpuio"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

[patch.crates-io]
gpuio-extension-sdk = { path = "rust/extension-sdk" }
accesskit_macos = { path = "vendor/accesskit-macos" }
taffy = { path = "vendor/taffy" }
