[package]
name = "gpuio-resource-audit"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[features]
presentation-diagnostics = ["dep:gpuio-native", "gpuio-native/presentation-diagnostics", "dep:serde_json"]

[dependencies]
gpuio-native = { path = "../../../rust/native", optional = true }
serde_json = { version = "1", optional = true }
gpuio-extension-sdk = { path = "../../../rust/extension-sdk" }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b", default-features = false, features = ["leak-detection"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
raw-window-handle = "0.6.2"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b", default-features = false, features = ["test-support"] }

[patch.crates-io]
gpuio-extension-sdk = { path = "../../../rust/extension-sdk" }
taffy = { path = "../../../vendor/taffy" }
accesskit_macos = { path = "../../../vendor/accesskit-macos" }
accesskit_consumer = { path = "../../../vendor/accesskit-consumer" }

# Optional presentation diagnostics use the same pinned platform patches as the composed backend.
[patch."https://github.com/zed-industries/zed.git"]
gpui = { path = "../../../vendor/gpui" }
gpui_macos = { path = "../../../vendor/gpui-macos" }
gpui_apple = { path = "../../../vendor/gpui-apple" }
