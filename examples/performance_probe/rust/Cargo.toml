[package]
name = "gpuio-performance-probe"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[features]
presentation-diagnostics = ["gpuio-native/presentation-diagnostics", "dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }
gpuio-native = { path = "../../../rust/native", features = ["performance-diagnostics"] }
gpuio-extension-sdk = { path = "../../../rust/extension-sdk" }
