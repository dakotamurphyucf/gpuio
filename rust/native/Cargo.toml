[package]
name = "gpuio-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
native-tests = ["dep:raw-window-handle", "dep:objc2", "dep:objc2-foundation"]
default = ["wayland", "x11"]
wayland = ["gpui/wayland", "gpui_platform/wayland"]
x11 = ["gpui/x11", "gpui_platform/x11"]

[dependencies]
gpui-base = { path = "../../vendor/gpui-base" }
gpuio-protocol = { path = "../protocol" }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b", features = ["font-kit", "runtime_shaders"] }
ocaml-interop = { git = "https://github.com/tizoc/ocaml-interop.git", rev = "9f941c63b8a9dcd652c6535da196f48d7a4dcc75", features = ["no-caml-startup"] }
binprot = { git = "https://github.com/LaurentMazare/binprot-rs.git", rev = "165b4d64d8f2a580af453f1e60deba41c28cd6df" }
async-channel = "2"
unicode-segmentation = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
raw-window-handle = { version = "0.6.2", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString", "NSRange"] }

[[test]]
name = "native_ui"
path = "tests/native_ui.rs"
harness = false
required-features = ["native-tests"]

[[test]]
name = "native_editor"
path = "tests/native_editor.rs"
harness = false
required-features = ["native-tests"]

[[test]]
name = "native_controls"
path = "tests/native_controls.rs"
harness = false
required-features = ["native-tests"]

[[test]]
name = "native_menus"
path = "tests/native_menus.rs"
harness = false
required-features = ["native-tests"]

[[test]]
name = "native_palette"
path = "tests/native_palette.rs"
harness = false
required-features = ["native-tests"]

[[test]]
name = "native_progress"
path = "tests/native_progress.rs"
harness = false
required-features = ["native-tests"]
