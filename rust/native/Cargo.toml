[package]
name = "gpuio-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
native-tests = []
native-image-tests = ["native-tests", "gpui_platform/test-support"]
default = ["wayland", "x11"]
wayland = ["gpui/wayland", "gpui_platform/wayland", "dep:gpuio-wayland"]
x11 = ["gpui/x11", "gpui_platform/x11"]

[dependencies]
gpui-base = { path = "../../vendor/gpui-base" }
gpuio-protocol = { path = "../protocol" }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "a57ba9b17c433ea1ebfdec8f649f4fa5a402d03b", features = ["font-kit", "runtime_shaders"] }
ocaml-interop = { git = "https://github.com/tizoc/ocaml-interop.git", rev = "9f941c63b8a9dcd652c6535da196f48d7a4dcc75", features = ["no-caml-startup"] }
binprot = { git = "https://github.com/LaurentMazare/binprot-rs.git", rev = "165b4d64d8f2a580af453f1e60deba41c28cd6df" }
async-channel = "2"
unicode-segmentation = "1"
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_lines_lf", "metric_utf16"] }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "default-themes", "regex-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
libc = "0.2"
raw-window-handle = "0.6.2"
futures-lite = "2"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
resvg = "=0.46.0"
roxmltree = "=0.21.1"
flate2 = "=1.1.10"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSRange", "NSURL", "NSArray", "NSNotification", "NSOperation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow", "NSView", "NSWorkspace", "NSAccessibility", "block2"] }
block2 = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
gpuio-portal = { path = "../portal" }
gpuio-wayland = { path = "../wayland", optional = true }

[dev-dependencies]
gpuio-portal = { path = "../portal" }
gpuio-wayland = { path = "../wayland" }

